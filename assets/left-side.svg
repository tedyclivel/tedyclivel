<svg width="110" height="520" viewBox="0 0 110 520"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="35%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- vertical glowing rail -->
  <rect x="53" y="10" width="3" height="500"
        rx="2" fill="url(#line)" opacity="0.75"/>

  <!-- animated particles -->
  <circle cx="54.5" cy="20" r="5"
          fill="#38BDF8" filter="url(#glow)">
    <animate
      attributeName="cy"
      values="20;500;20"
      dur="6s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="54.5" cy="160" r="3.5"
          fill="#818CF8" filter="url(#glow)">
    <animate
      attributeName="cy"
      values="160;470;40;160"
      dur="8s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="54.5" cy="400" r="4"
          fill="#A78BFA" filter="url(#glow)">
    <animate
      attributeName="cy"
      values="400;80;400"
      dur="7s"
      repeatCount="indefinite"/>
  </circle>

  <!-- orbiting accents -->
  <circle cx="54.5" cy="120" r="18"
          fill="none"
          stroke="#38BDF8"
          stroke-width="1"
          opacity="0.35">
    <animate
      attributeName="r"
      values="10;24;10"
      dur="3s"
      repeatCount="indefinite"/>
    <animate
      attributeName="opacity"
      values=".15;.65;.15"
      dur="3s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="54.5" cy="330" r="18"
          fill="none"
          stroke="#A78BFA"
          stroke-width="1"
          opacity="0.35">
    <animate
      attributeName="r"
      values="24;10;24"
      dur="4s"
      repeatCount="indefinite"/>
    <animate
      attributeName="opacity"
      values=".65;.15;.65"
      dur="4s"
      repeatCount="indefinite"/>
  </circle>

</svg>
