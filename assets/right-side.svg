<svg width="42" height="760" viewBox="0 0 42 760"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0"/>
      <stop offset="20%" stop-color="#A78BFA"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="80%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect
    x="20"
    y="0"
    width="2"
    height="760"
    rx="1"
    fill="url(#rail)"
    opacity="0.5"
  />

  <circle cx="21" cy="740" r="4" fill="#A78BFA" filter="url(#glow)">
    <animate
      attributeName="cy"
      values="740;20;740"
      dur="7s"
      repeatCount="indefinite"
    />
  </circle>

  <circle cx="21" cy="520" r="3" fill="#818CF8" filter="url(#glow)">
    <animate
      attributeName="cy"
      values="520;90;680;520"
      dur="9s"
      repeatCount="indefinite"
    />
  </circle>

  <circle cx="21" cy="120" r="3.5" fill="#38BDF8" filter="url(#glow)">
    <animate
      attributeName="cy"
      values="120;650;120"
      dur="8s"
      repeatCount="indefinite"
    />
  </circle>

  <circle cx="21" cy="280" r="7"
          fill="none"
          stroke="#A78BFA"
          stroke-width="1">
    <animate
      attributeName="r"
      values="3;10;3"
      dur="3s"
      repeatCount="indefinite"
    />
    <animate
      attributeName="opacity"
      values=".2;.9;.2"
      dur="3s"
      repeatCount="indefinite"
    />
  </circle>

  <circle cx="21" cy="570" r="7"
          fill="none"
          stroke="#38BDF8"
          stroke-width="1">
    <animate
      attributeName="r"
      values="10;3;10"
      dur="4s"
      repeatCount="indefinite"
    />
    <animate
      attributeName="opacity"
      values=".8;.2;.8"
      dur="4s"
      repeatCount="indefinite"
    />
  </circle>

</svg>
